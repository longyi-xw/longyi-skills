      });
    });
    s2.appendChild(h('div', { class: 'table-wrap' }, h('table', null,
      h('thead', null, h('tr', null, h('th', { text: '品种' }), h('th', { class: 'r', text: '最新值' }), h('th', { class: 'r', text: '区间变动' }),
        h('th', { text: '幅度（组内同比例）' }), h('th', { text: '备注' }))),
      tbody)));
    main.appendChild(s2);
  }

  /* ---------- 3. 新闻总结 ---------- */
  function newsCard(n) {
    return h('article', { class: 'card', id: 'item-' + n.id },
      h('div', { class: 'card-meta' },
        h('time', { datetime: n.date, text: fmtDate(n.date, true) }),
        n.region ? h('span', { class: 'chip', text: n.region }) : null,
        n.category ? h('span', { class: 'chip', text: n.category }) : null,
        n.background ? h('span', { class: 'chip chip-bg', title: '事件发生在统计区间之外，作为理解本期事件的背景收录', text: '背景 · 窗口外' }) : null,
        stars(n.importance), verifyBadge(n.verification),
        h('span', { class: 'card-id', text: refIndex[n.id] ? refIndex[n.id].label : '' })),
      h('h4', { text: n.title }),
      n.summary ? h('p', { class: 'summary' }, rich(n.summary)) : null,
      has(n.keyPoints) ? h('ul', { class: 'points' }, arr(n.keyPoints).map(function (p) { return h('li', null, rich(p)); })) : null,
      figures(n.figures),
      sourcesLine(n.sources));
  }

  if (has(D.news)) {
    var s3 = section('sec-news', '新闻总结', { tag: '事实陈述', intro: '仅转述已发生的事实与各方公开表态，不含评价；同一事件的多家报道已合并。' });
    var news = arr(D.news);
    var regionOrder = arr(meta.regions).slice();
    news.forEach(function (n) { if (n.region && regionOrder.indexOf(n.region) < 0) regionOrder.push(n.region); });
    regionOrder = regionOrder.filter(function (r) { return news.some(function (n) { return n.region === r; }); });
    var cats = CATEGORY_ORDER.filter(function (c) { return news.some(function (n) { return n.category === c; }); });
    news.forEach(function (n) { if (n.category && cats.indexOf(n.category) < 0) cats.push(n.category); });

    var state = { group: 'region', region: null, category: null, important: false };
    var listEl = h('div');
    function segGroup(label, options, key, allLabel) {
      var btns = [];
      var wrap = h('div', { class: 'ctrl-group' }, h('span', { class: 'ctrl-label', text: label }));
      options.forEach(function (o) {
        var b = h('button', { class: 'seg', type: 'button', 'aria-pressed': String(state[key] === o.value), text: o.label,
          onclick: function () { state[key] = o.value; btns.forEach(function (x) { x.b.setAttribute('aria-pressed', String(state[key] === x.v)); }); renderNews(); } });
        btns.push({ b: b, v: o.value });
        wrap.appendChild(b);
      });
      return wrap;
    }
    function opts(list) { return [{ label: '全部', value: null }].concat(list.map(function (x) { return { label: x, value: x }; })); }
    var impToggle = h('input', { type: 'checkbox', onchange: function (e) { state.important = e.target.checked; renderNews(); } });
    s3.appendChild(h('div', { class: 'controls' },
      segGroup('分组', [{ label: '按地区', value: 'region' }, { label: '按主题', value: 'category' }, { label: '按日期', value: 'date' }], 'group'),
      regionOrder.length > 1 ? segGroup('地区', opts(regionOrder), 'region') : null,
      cats.length > 1 ? segGroup('主题', opts(cats), 'category') : null,
      h('label', { class: 'toggle' }, impToggle, '仅看 ★★★')));
    s3.appendChild(listEl);

    function renderNews() {
      listEl.textContent = '';
      var rows = news.filter(function (n) {
        return (!state.region || n.region === state.region) && (!state.category || n.category === state.category) && (!state.important || +n.importance >= 3);
      });
      if (!rows.length) { listEl.appendChild(h('p', { class: 'empty-note', text: '没有符合筛选条件的条目。' })); return; }
      var keys, keyOf, title;
      if (state.group === 'date') {
        keyOf = function (n) { return n.date || ''; };
        keys = rows.map(keyOf).filter(function (v, i, a) { return a.indexOf(v) === i; }).sort().reverse();
        title = function (k) { return fmtDate(k, true); };
      } else if (state.group === 'category') {
        keyOf = function (n) { return n.category || '其他'; };
        keys = cats.concat(['其他']).filter(function (c, i, a) { return a.indexOf(c) === i && rows.some(function (n) { return keyOf(n) === c; }); });
        title = function (k) { return k; };
      } else {
        keyOf = function (n) { return n.region || '其他'; };
        keys = regionOrder.concat(['其他']).filter(function (c, i, a) { return a.indexOf(c) === i && rows.some(function (n) { return keyOf(n) === c; }); });
        title = function (k) { return k; };
      }
      keys.forEach(function (k) {
        var items = rows.filter(function (n) { return keyOf(n) === k; }).sort(function (a, b) {
          return (+b.importance || 0) - (+a.importance || 0) || String(b.date).localeCompare(String(a.date));
        });
        listEl.appendChild(h('div', { class: 'group-head' }, title(k), h('span', { class: 'count', text: items.length + ' 条' })));
        items.forEach(function (n) { listEl.appendChild(newsCard(n)); });
      });
    }
    renderNews();
    main.appendChild(s3);
  }

  /* ---------- 4. 自然灾害与突发事件 ---------- */
  if (Array.isArray(D.disasters)) {
    var s4 = section('sec-disasters', '自然灾害与突发事件', { tag: '事实陈述', intro: '收录对经济活动、供应链或市场价格产生可观察影响的重大自然灾害与突发事件。' });
    if (!D.disasters.length) {
      s4.appendChild(h('p', { class: 'empty-note', text: D.disastersNote || '统计区间内未检索到对市场产生显著影响的重大自然灾害或突发事件。' }));
    }
    D.disasters.forEach(function (d) {
      var kv = h('dl', { class: 'kv' });
      if (d.location) append(kv, [h('dt', { text: '地点' }), h('dd', { text: d.location })]);
      arr(d.impacts).forEach(function (f) { append(kv, [h('dt', { text: f.label }), h('dd', null, rich(f.value))]); });
      if (has(d.sectors)) append(kv, [h('dt', { text: '涉及领域' }), h('dd', null, arr(d.sectors).map(function (s) { return [h('span', { class: 'chip', text: s }), ' ']; }))]);
      if (d.marketObservations) append(kv, [h('dt', { text: '市场反应' }), h('dd', null, rich(d.marketObservations))]);
      s4.appendChild(h('article', { class: 'card', id: 'item-' + d.id },
        h('div', { class: 'card-meta' },
          h('time', { datetime: d.date, text: fmtDate(d.date, true) }),
          d.type ? h('span', { class: 'chip', text: d.type }) : null,
          stars(d.importance), verifyBadge(d.verification),
          h('span', { class: 'card-id', text: refIndex[d.id] ? refIndex[d.id].label : '' })),
        h('h4', { text: d.title }),
        d.summary ? h('p', { class: 'summary' }, rich(d.summary)) : null,
        kv.childNodes.length ? kv : null,
        sourcesLine(d.sources)));
    });
    main.appendChild(s4);
  }

  /* ---------- 5. 市场分析 ---------- */
  var A = D.analysis;
  if (A) {
    var s5 = section('sec-analysis', '市场分析', { cls: 'analysis', tag: '分析解读' });
    s5.appendChild(h('div', { class: 'notice', text: '以下内容是基于上方公开信息的环境分析，用于帮助理解当前市场所处的状态与风险，不构成投资建议。每条判断附有依据与反向证据，置信度为定性评估。' }));

    if (has(A.overview) || has(A.state)) {
      sub(s5, 'sec-a-overview', '市场环境总览');
      if (has(A.state)) {
        s5.appendChild(h('div', { class: 'tiles', style: 'margin:0 0 16px' }, arr(A.state).map(function (t) {
          return h('div', { class: 'tile' }, h('div', { class: 'tile-label', text: t.label }),
            h('div', { class: 'tile-value', style: 'font-size:18px', text: t.value }),
            t.note ? h('div', { class: 'tile-note' }, rich(t.note), refs(t.refs)) : null);
        })));
      }
      if (has(A.overview)) s5.appendChild(h('div', { class: 'overview' }, paras(A.overview)));
    }

    if (has(A.cycles)) {
      sub(s5, 'sec-a-cycles', '周期定位');
      var cyc = arr(A.cycles);
      s5.appendChild(h('div', { class: 'table-wrap' }, h('table', { class: 'cycles' },
        h('thead', null, h('tr', null, ['经济体', '增长', '通胀', '货币政策', '财政政策', '周期判断', '主要依据', '置信度'].map(function (t) { return h('th', { text: t }); }))),
        h('tbody', null, cyc.map(function (c) {
          return h('tr', null,
            h('td', null, h('strong', { text: c.economy })),
            h('td', { text: c.growth || '—' }), h('td', { text: c.inflation || '—' }),
            h('td', { text: c.monetary || '—' }), h('td', { text: c.fiscal || '—' }),
            h('td', { text: c.phase || '—' }),
            h('td', { style: 'min-width:220px' }, rich(c.evidence || '—'), refs(c.refs)),
            h('td', null, level(c.confidence)));
        })))));
    }

    if (has(A.signals)) {
      sub(s5, 'sec-a-signals', '市场信号');
      s5.appendChild(h('div', { class: 'grid-2' }, arr(A.signals).map(function (g) {
        var dir = DIRECTION[g.direction] || DIRECTION.neutral;
        var st = Math.max(0, Math.min(3, +g.strength || 0));
        var meter = h('span', { class: 'meter', title: '信号强度 ' + st + '/3' });
        for (var i = 1; i <= 3; i++) meter.appendChild(h('span', { class: i <= st ? 'on' : '' }));
        var kv = h('dl', { class: 'kv' });
        if (g.observation) append(kv, [h('dt', { text: '观察到' }), h('dd', null, rich(g.observation))]);
        if (g.interpretation) append(kv, [h('dt', { text: '可能含义' }), h('dd', null, rich(g.interpretation))]);
        if (g.counterEvidence) append(kv, [h('dt', { text: '反向证据' }), h('dd', null, rich(g.counterEvidence))]);
        if (has(g.refs)) append(kv, [h('dt', { text: '相关条目' }), h('dd', null, refs(g.refs))]);
        return h('div', { class: 'card signal' },
          h('div', { class: 'signal-head' },
            g.category ? h('span', { class: 'chip', text: g.category }) : null,
            h('span', { class: 'badge' }, h('span', { class: 'dot', style: 'background:' + dir.color }), dir.icon + ' ' + dir.label),
            h('span', { class: 'badge' }, '强度 ', meter),
            g.confidence ? h('span', { class: 'badge' }, '置信度 ', level(g.confidence)) : null),
          h('h4', { text: g.title }), kv);
      })));
    }

    if (has(A.scenarios)) {
      sub(s5, 'sec-a-scenarios', '情景推演');
      s5.appendChild(h('div', { class: 'grid-3' }, arr(A.scenarios).map(function (c) {
        return h('div', { class: 'card scenario' },
          h('h4', { text: c.name }),
          c.likelihood ? h('div', { class: 'likelihood', text: '相对可能性：' + c.likelihood }) : null,
          c.description ? h('p', null, rich(c.description)) : null,
          has(c.triggers) ? [h('div', { class: 'sub-title', text: '触发条件' }), h('ul', null, arr(c.triggers).map(function (t) { return h('li', null, rich(t)); }))] : null,
          has(c.watch) ? [h('div', { class: 'sub-title', text: '观察指标' }), h('ul', null, arr(c.watch).map(function (t) { return h('li', null, rich(t)); }))] : null);
      })));
    }

    if (has(A.risks) || has(A.strategies)) {
      sub(s5, 'sec-a-risks', '风险提示与规避思路');
      if (has(A.risks)) {
        s5.appendChild(h('div', { class: 'table-wrap' }, h('table', null,
          h('thead', null, h('tr', null, h('th', { text: '风险' }), h('th', { text: '发生可能性' }), h('th', { text: '潜在影响' }), h('th', { text: '说明' }))),
          h('tbody', null, arr(A.risks).map(function (r) {
            return h('tr', null, h('td', null, h('strong', { text: r.risk })), h('td', null, level(r.probability)), h('td', null, level(r.impact)),
              h('td', null, rich(r.description || ''), refs(r.refs)));
          })))));
      }
      if (has(A.strategies)) {
        s5.appendChild(h('p', { class: 'block-intro', style: 'margin-top:18px', text: '以下为通用风险管理思路，仅针对上述环境特征，不涉及具体标的与仓位，是否适用取决于个人情况。' }));
        arr(A.strategies).forEach(function (x) {
          var t = typeof x === 'string' ? { approach: x } : x;
          s5.appendChild(h('div', { class: 'strategy' },
            t.condition ? h('div', { class: 'cond', text: '适用情形：' + t.condition }) : null,
            h('div', { class: 'act' }, rich(t.approach))));
        });
      }
    }

    if (has(A.watchlist)) {
      sub(s5, 'sec-a-watch', '后续关注日程');
      s5.appendChild(h('div', { class: 'table-wrap' }, h('table', null,
        h('thead', null, h('tr', null, h('th', { text: '日期' }), h('th', { text: '地区' }), h('th', { text: '事件' }), h('th', { text: '关注原因' }))),
        h('tbody', null, arr(A.watchlist).map(function (w) {
          return h('tr', null, h('td', { class: 'num', style: 'white-space:nowrap', text: w.date ? fmtDate(w.date, true) : '待定' }),
            h('td', { text: w.region || '' }), h('td', null, rich(w.event)), h('td', { class: 'muted' }, rich(w.why || '')));
        })))));
    }
    main.appendChild(s5);
  }

  /* ---------- 6. 方法与来源 ---------- */
  var M = D.method || {};
  if (has(D.sources) || D.method) {
    var s6 = section('sec-sources', '方法与来源');
    var kv6 = h('dl', { class: 'kv', style: 'margin-bottom:12px' });
    if (M.window) append(kv6, [h('dt', { text: '时间窗口' }), h('dd', { text: M.window })]);
    if (M.scope) append(kv6, [h('dt', { text: '检索范围' }), h('dd', { text: M.scope })]);
    if (M.searchCount) append(kv6, [h('dt', { text: '检索次数' }), h('dd', { text: String(M.searchCount) })]);
    if (has(M.notes)) append(kv6, [h('dt', { text: '处理说明' }), h('dd', null, h('ul', null, arr(M.notes).map(function (t) { return h('li', null, rich(t)); })))]);
    if (has(M.limitations)) append(kv6, [h('dt', { text: '局限与缺口' }), h('dd', null, h('ul', null, arr(M.limitations).map(function (t) { return h('li', null, rich(t)); })))]);
    if (kv6.childNodes.length) s6.appendChild(kv6);
    if (has(D.sources)) {
      s6.appendChild(h('ol', { class: 'source-list' }, arr(D.sources).map(function (s) {
        var url = safeUrl(s.url);
        return h('li', { id: 'src-' + s.id },
          h('strong', { text: s.publisher || '' }), s.publisher ? '：' : '',
          url ? h('a', { href: url, target: '_blank', rel: 'noopener noreferrer', text: s.title || url }) : (s.title || ''),
          s.date ? h('span', { class: 'muted', text: '  ' + s.date }) : null,
          s.type ? [' ', h('span', { class: 'chip', text: SOURCE_TYPE[s.type] || s.type })] : null);
      })));
    }
    s6.appendChild(h('p', { class: 'disclaimer', text: D.disclaimer || DEFAULT_DISCLAIMER }));
    main.appendChild(s6);
  }

  /* ---------- 目录与滚动高亮 ---------- */
  toc.appendChild(h('div', { class: 'toc-title', text: '目录' }));
  var tocLinks = {};
  sections.forEach(function (s) {
    tocLinks[s.id] = h('a', { href: '#' + s.id, text: s.title });
    toc.appendChild(tocLinks[s.id]);
    s.subs.forEach(function (x) { toc.appendChild(h('a', { class: 'sub', href: '#' + x.id, text: x.title })); });
  });
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        Object.keys(tocLinks).forEach(function (k) { tocLinks[k].classList.toggle('active', k === en.target.id); });
      });
    }, { rootMargin: '-10% 0px -80% 0px' });
    sections.forEach(function (s) { io.observe(s.el); });
  }

  document.body.appendChild(h('footer', { class: 'page-foot', text: '由 market-news-brief 技能生成 · 报告模板 v1.0' + (meta.generatedAt ? ' · ' + meta.generatedAt : '') }));

  /* 若通过 #item-xxx 打开，渲染后再定位一次 */
  if (location.hash) { var t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
})();
</script>
</body>
</html>
